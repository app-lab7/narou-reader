<style>
html{color-scheme:light}body{margin:0}
[hidden]{display:none!important}
/* 全画面の読書アプリ。上に細いバー、中央に本文、下に進捗スライダー。設定は下から出るシート。 */
:root{
  --bg:#eef1f0;
  --panel:#fafbfa;
  --fg:#1e2321;
  --muted:#66706c;
  --line:#d3dad7;
  --accent:#2c5f5a;
  --accent-fg:#ffffff;
  --page:#fafbf9;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --font-mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111413;--panel:#1a1e1d;--fg:#dfe4e1;--muted:#8c9692;--line:#2c3331;--accent:#7fc3bb;--accent-fg:#0d1a18;--page:#171a19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111413;--panel:#1a1e1d;--fg:#dfe4e1;--muted:#8c9692;--line:#2c3331;--accent:#7fc3bb;--accent-fg:#0d1a18;--page:#171a19;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 読書面の配色。自動はページの配色に従う */
#app[data-skin="paper"]{--page:#fbfbf8;--fg:#1f1f1c;--bg:#e9e9e4;--panel:#fbfbf8;--line:#d6d6cf;--muted:#6b6b64}
#app[data-skin="sepia"]{--page:#f2e6cb;--fg:#3a2e1f;--bg:#e6d6b3;--panel:#f6ecd5;--line:#d6c59f;--muted:#7a6a50}
#app[data-skin="night"]{--page:#16181b;--fg:#cdd1d6;--bg:#0e1012;--panel:#1c1f23;--line:#2b3036;--muted:#8a929b;--accent:#8fb8d9;--accent-fg:#0c141b}
#app{height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}

.bar{display:flex;align-items:center;gap:8px;padding-block:8px;min-height:48px}
.bar h1{font-size:14px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn:active{transform:translateY(1px)}

/* 入力画面 */
#input{flex:1;min-height:0;overflow-y:auto;padding-block:8px 24px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.wrap h2{font-family:var(--font-mincho);font-size:26px;font-weight:600;margin:12px 0 0;text-wrap:balance;letter-spacing:.04em}
.steps{margin:0;padding-left:1.3em;color:var(--muted);line-height:1.8;font-size:14px}
.steps li{padding-left:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px;font-size:15px;min-width:0}
textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px;min-height:240px;resize:vertical;font-size:15px;line-height:1.7;min-width:0;font-family:var(--font-mincho)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.hint b{color:var(--fg);font-weight:500}

.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 6px;font-size:13px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
#msg{font-size:13px;color:var(--muted);min-height:1.4em;line-height:1.6}
#msg.err{color:#c0392b}
.bar .btn.sm{padding:6px 9px;font-size:12px;white-space:nowrap}
.bar .btn[disabled]{opacity:.35;cursor:default}
/* 読書画面 */
#read{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;background:var(--page);overflow:hidden}
#reader{
  position:absolute;inset:0;overflow:auto;
  font-family:var(--font-mincho);font-size:var(--fs,20px);line-height:var(--lh,1.9);
  color:var(--fg);-webkit-overflow-scrolling:touch;
  padding:28px 24px;
}
#reader{scrollbar-width:none}
#reader::-webkit-scrollbar{display:none}
#spacer{display:block;inline-size:1px;min-block-size:0}
#reader.gothic{font-family:var(--font-gothic)}
#reader.v{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden;padding:24px 28px;text-orientation:mixed}
#reader.h{writing-mode:horizontal-tb;overflow-x:hidden;overflow-y:auto}
#reader.h #content{max-width:36em;margin-inline:auto}
#content h3{font-size:1.25em;font-weight:600;margin:0 0 1.6em;letter-spacing:.08em}
#reader.v #content h3{margin:0 0 0 2.4em}
#content p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-break:strict;word-break:normal;font-feature-settings:"palt" 0}
#content p.gap{min-height:1em}
.tcy{text-combine-upright:all}
ruby rt{font-size:.5em}
#reader.v #content{padding-inline-end:2px}

#app.reading{background:var(--page)}
#bg{position:fixed;inset:0;z-index:0;display:none;background-color:var(--page);background-repeat:no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:var(--page);opacity:var(--veil,.7)}
#app.reading.hasbg #bg{display:block}
#app.reading.hasbg{background:transparent}
#app.hasbg #stage{background:transparent}
#read{position:relative;z-index:1}
#bgprev{position:relative;height:170px;aspect-ratio:var(--ar,.5);margin-inline:auto;border:1px solid var(--line);border-radius:4px;overflow:hidden;background-color:var(--page);background-repeat:no-repeat}
#bgprev .pv{position:absolute;inset:0;background:var(--page);opacity:var(--veil,.7)}
#bgbox{display:flex;flex-direction:column;gap:14px}
.rbar{display:flex;align-items:center;gap:6px;padding-block:6px 4px;min-height:52px}
.tbtn{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;padding:10px 8px;border-radius:6px;white-space:nowrap;line-height:1.2}
.tbtn:active{background:var(--line)}
.tbtn[disabled]{opacity:.3}
#hdr{flex:1;min-width:0;margin:0;font-size:14px;font-weight:600;line-height:1.35;display:flex;flex-direction:column;gap:1px;text-align:center;white-space:normal}
#hdr small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em}
#hdr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#foot{display:flex;align-items:center;gap:6px;padding-block:4px 8px;min-height:48px;font-size:12px;color:var(--muted)}
#foot input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#pct{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
body.chrome-off .bar,body.chrome-off #foot{visibility:hidden}

/* 設定シート */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--fg);border-top:1px solid var(--line);
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 28px rgba(0,0,0,.18);z-index:5;max-height:78vh;overflow-y:auto}
#sheet .in{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.set{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:center;font-size:13px}
.set > span{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:3.4em;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.set input[type=range]{width:100%;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}

/* 続きから読む */
#resume{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:14px}
#resume .rt{flex:1;min-width:0}
#resume .rt b{display:block;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#resume .rt small{color:var(--muted);font-size:12px}
/* 本棚 */
#shelf{margin-bottom:14px}
#shelf .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#shelf .sh b{font-size:13px;color:var(--muted);font-weight:600}
#shelf .bk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px}
#shelf .bk .go{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;padding:11px 4px 11px 14px;font:inherit}
#shelf .bk .go b{display:block;font-size:14px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shelf .bk .go small{color:var(--muted);font-size:12px}
#shelf .bk .nw{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;vertical-align:1px}
#shelf .bk .rm{border:0;background:transparent;color:var(--muted);font-size:18px;padding:8px 12px;line-height:1}
/* 目次 */
#toc{position:fixed;inset:0;z-index:7;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:var(--font-ui)}
#toc .th{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-left,0px)) 6px;min-height:52px;border-bottom:1px solid var(--line)}
#toc .tt{flex:1;min-width:0;text-align:center}
#toc .tt b{display:block;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc .tt small{font-size:11px;color:var(--muted)}
#toc .tl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
#toc .tin{max-width:640px;margin-inline:auto}
#toc .ch{padding:16px 16px 6px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
#toc .it{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding:12px 16px;min-height:46px;font-size:15px;line-height:1.5}
#toc .it:active{background:var(--line)}
#toc .it .n{flex:none;min-width:2.4em;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#toc .it[aria-current="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
#toc .it[aria-current="true"]::after{content:"読書中";flex:none;margin-left:auto;font-size:11px;color:var(--accent)}
#toc .tf{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));min-height:50px}
#toc .tf select{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:6px;padding:8px;font-size:13px}
#toc .tmsg{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
</style>
</head>
<body>

<div id="app">
  <div id="bg" aria-hidden="true"></div>
  <section id="input">
    <div class="bar"><h1>縦書きリーダー</h1></div>
    <div class="wrap">
      <div id="resume" hidden>
        <div class="rt"><b id="rs-t"></b><small id="rs-s"></small></div>
        <button class="btn primary" id="rs-go">続きから読む</button>
      </div>
      <div id="shelf" hidden>
        <div class="sh"><b>本棚</b><button class="tbtn" id="sh-chk">新着を確認</button></div>
        <div id="sh-l"></div>
      </div>
      <h2>コピーした本文を、読みやすく整えて読む</h2>
      <div class="tabs" id="tabs">
        <button data-m="web" aria-pressed="true">なろうのURLから</button>
        <button data-m="paste" aria-pressed="false">貼り付けて読む</button>
      </div>
      <div id="m-web" class="wrap" style="max-width:none">
        <label class="f" for="url">作品または話のURL
          <input type="text" id="url" inputmode="url" placeholder="https://ncode.syosetu.com/n2267be/1/">
        </label>
        <label class="f" for="api">取得用スクリプトのURL(自分でデプロイしたもの)
          <input type="text" id="api" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
        </label>
        <div class="row"><button class="btn primary" id="fetch">取得して読む</button><button class="btn" id="tocopen">目次を見る</button></div>
        <div id="msg" role="status"></div>
        <p class="hint">取得用スクリプトは同梱の <b>Code.gs</b> です。Google Apps Scriptに貼り付けて、ウェブアプリ(アクセスできるユーザー：全員)としてデプロイし、できたURLを上の欄に入れます。一度入れればこのブラウザに保存されます。読むのは個人利用の範囲にしてください。</p>
      </div>
      <div id="m-paste" class="wrap" style="max-width:none" hidden>
      <label class="f" for="ttl">タイトル(話数など)
        <input type="text" id="ttl" placeholder="例：第一話 はじまりの朝">
      </label>
      <label class="f" for="src">本文
        <textarea id="src" placeholder="ここに本文を貼り付け"></textarea>
      </label>
      <div class="row">
        <button class="btn primary" id="go">読む</button>
        <button class="btn" id="sample">サンプルを入れる</button>
        <button class="btn" id="clear">空にする</button>
      </div>
      <p class="hint">ルビは <b>｜漢字《かんじ》</b> または <b>漢字《かんじ》</b> の書き方で振り仮名になります。貼り付けた本文と読んだ位置は、このブラウザに保存されます。</p>
      </div>
    </div>
  </section>

  <section id="read" hidden>
    <div class="rbar">
      <button class="tbtn" id="back" aria-label="入力画面に戻る">‹ 戻る</button>
      <h1 id="hdr"></h1>
      <button class="tbtn" id="favbtn" hidden aria-label="本棚に追加">☆ 本棚</button>
      <button class="tbtn" id="tocbtn" aria-label="目次と話一覧" hidden>目次</button>
      <button class="tbtn" id="gear" aria-expanded="false" aria-controls="sheet">設定</button>
    </div>
    <div id="stage"><div id="reader" class="v" tabindex="0"><div id="content"></div></div></div>
    <div id="foot">
      <button class="tbtn" id="pep" aria-label="前の話へ" hidden>‹ 前話</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="読んだ位置">
      <span id="pct">1/1</span>
      <button class="tbtn" id="nep" aria-label="次の話へ" hidden>次話 ›</button>
    </div>
  </section>

  <div id="toc" hidden role="dialog" aria-label="目次">
    <div class="th">
      <button class="tbtn" id="tocx">‹ 閉じる</button>
      <div class="tt"><b id="toc-t"></b><small id="toc-a"></small></div>
      <span style="width:4.2em"></span>
    </div>
    <div class="tl" id="toc-l"><div class="tin" id="toc-in"></div></div>
    <div class="tf">
      <button class="tbtn" id="toc-p">‹ 前</button>
      <select id="toc-s" aria-label="表示する範囲"></select>
      <button class="tbtn" id="toc-n">次 ›</button>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="in">
      <div class="set"><span>向き</span><div class="seg" id="s-dir">
        <button data-v="v">縦書き</button><button data-v="h">横書き</button></div></div>
      <div class="set"><span>文字の大きさ</span><input type="range" id="s-fs" min="14" max="34" step="1" aria-label="文字の大きさ"></div>
      <div class="set"><span>行の間隔</span><input type="range" id="s-lh" min="1.5" max="2.6" step="0.1" aria-label="行の間隔"></div>
      <div class="set"><span>書体</span><div class="seg" id="s-font">
        <button data-v="mincho">明朝</button><button data-v="gothic">ゴシック</button></div></div>
      <div class="set"><span>配色</span><div class="seg" id="s-skin">
        <button data-v="auto">自動</button><button data-v="paper">白</button><button data-v="sepia">セピア</button><button data-v="night">黒</button></div></div>
      <div class="set"><span>背景</span><div class="seg">
        <button type="button" id="bgpick">画像を選ぶ</button><button type="button" id="bgclear">なし</button></div></div>
      <div id="bgbox">
        <div id="bgprev" aria-hidden="true"><div class="pv"></div></div>
        <div class="set"><span>表示</span><div class="seg" id="s-bgfit">
          <button type="button" data-v="contain">全体を表示</button><button type="button" data-v="cover">画面いっぱい</button></div></div>
        <div class="set"><span>拡大</span><input type="range" id="s-bgz" min="100" max="300" step="5" aria-label="画像の拡大"></div>
        <div class="set"><span>左右の位置</span><input type="range" id="s-bgx" min="0" max="100" step="1" aria-label="画像の左右の位置"></div>
        <div class="set"><span>上下の位置</span><input type="range" id="s-bgy" min="0" max="100" step="1" aria-label="画像の上下の位置"></div>
        <div class="set"><span>背景の濃さ</span><input type="range" id="s-bgv" min="0" max="100" step="5" aria-label="背景の濃さ"></div>
        <button type="button" class="btn" id="bgreset">サイズと位置を戻す</button>
      </div>
      <input type="file" id="bgfile" accept="image/*" hidden>
      <div id="bgnote" class="hint"></div>
      <button class="btn primary" id="close">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY="narou-reader-v1";
  var SAMPLE_TITLE="サンプル 雨の駅";
  var SAMPLE_TEXT=[
    "　終電の一本前、駅のホームには傘を持たない人が三人だけ残っていた。",
    "",
    "　｜遥《はるか》は鞄から折りたたみ傘を出しかけて、やめた。屋根の端から落ちる雨粒が、一定の間隔で白線を叩いている。それを数えているうちに、2分ほどが過ぎた。",
    "",
    "「次の電車、遅れてるみたいですよ」",
    "",
    "　隣に立っていた老人が、掲示板を指さして言った。電光の文字は、赤い色で十五分の遅延を告げている。",
    "",
    "　遥は小さく礼を言い、ベンチに腰を下ろした。濡れた金属の冷たさが、コート越しに伝わってくる。",
    "",
    "　線路の向こうで、街の灯りが雨に滲んでいた。"
  ].join("\n");

  var st={title:"",text:"",dir:"v",fs:20,lh:1.9,font:"mincho",skin:"auto",pos:0,reading:false,ncode:"",ep:0,api:"",hasPrev:false,hasNext:false,mode:"web",bgv:30,bgfit:"contain",bgz:100,bgx:50,bgy:50,anchor:null,shelf:[],work:"",author:""};
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o){if(k in st)st[k]=o[k];}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

  var BGKEY="narou-reader-bg",bgData="";
  try{bgData=localStorage.getItem(BGKEY)||"";}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var app=$("app"),inputV=$("input"),readV=$("read"),reader=$("reader"),content=$("content"),
      seek=$("seek"),pct=$("pct"),sheet=$("sheet"),gear=$("gear");

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function inline(line){
    var s=esc(line);
    if(st.dir==="v"){s=s.replace(/(^|[^0-9０-９])([0-9０-９]{2})(?![0-9０-９])/g,function(m,a,b){return a+'<span class="tcy">'+b+'</span>'});}
    s=s.replace(/[|｜]([^|｜《\n]+)《([^》\n]+)》/g,"<ruby>$1<rt>$2</rt></ruby>");
    s=s.replace(/([一-龠々〆ヶ]+)《([^》\n]+)》/g,"<ruby>$1<rt>$2</rt></ruby>");
    return s;
  }
  function render(){
    var lines=st.text.replace(/\r\n?/g,"\n").split("\n");
    var html="";
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      html+= l.trim()===""?'<p class="gap"><br></p>':"<p>"+inline(l)+"</p>";
    }
    content.innerHTML=html+'<div id="spacer"></div>';
  }
  function applyView(){
    reader.className=(st.dir==="v"?"v":"h")+(st.font==="gothic"?" gothic":"");
    reader.style.setProperty("--fs",st.fs+"px");
    reader.style.setProperty("--lh",st.lh);
    if(st.skin==="auto")app.removeAttribute("data-skin");else app.setAttribute("data-skin",st.skin);
    seek.dir=st.dir==="v"?"rtl":"ltr";
    $("s-fs").value=st.fs;$("s-lh").value=st.lh;
    ["s-dir:dir","s-font:font","s-skin:skin"].forEach(function(p){
      var a=p.split(":");
      [].forEach.call($(a[0]).querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.dataset.v===st[a[1]]?"true":"false")});
    });
    var h=$("hdr");h.textContent="";
    if(st.ncode){var sm=document.createElement("small");sm.textContent=st.ep+"話目";h.appendChild(sm);}
    var sp2=document.createElement("span");sp2.textContent=st.title||"無題";h.appendChild(sp2);
    document.title=st.title?st.title+" - なろうリーダー":"なろうリーダー";
    applyBg();
    var web=!!st.ncode;
    $("favbtn").hidden=!web;favLabel();$("pep").hidden=!web;$("nep").hidden=!web;$("tocbtn").hidden=!web;
    $("pep").disabled=!st.hasPrev;$("nep").disabled=!st.hasNext;
  }
  var bgNat={w:0,h:0,k:""};
  function bgKey(){return bgData?bgData.length+":"+bgData.slice(-32):"";}
  function paintBg(el,W,H){
    el.style.backgroundImage=bgData?'url("'+bgData+'")':"";
    if(!bgData)return;
    if(!bgNat.w){el.style.backgroundSize="contain";el.style.backgroundPosition="center";return;}
    var s0=(st.bgfit==="cover"?Math.max:Math.min)(W/bgNat.w,H/bgNat.h),z=st.bgz/100;
    el.style.backgroundSize=(bgNat.w*s0*z)+"px "+(bgNat.h*s0*z)+"px";
    el.style.backgroundPosition=st.bgx+"% "+st.bgy+"%";
  }
  function applyBg(){
    var el=$("bg"),pv=$("bgprev"),veil=String(1-st.bgv/100);
    el.style.setProperty("--veil",veil);pv.style.setProperty("--veil",veil);
    app.classList.toggle("hasbg",!!bgData);
    $("s-bgv").value=st.bgv;$("s-bgz").value=st.bgz;$("s-bgx").value=st.bgx;$("s-bgy").value=st.bgy;
    [].forEach.call($("s-bgfit").querySelectorAll("button"),function(b){b.setAttribute("aria-pressed",b.dataset.v===st.bgfit?"true":"false")});
    $("bgbox").hidden=!bgData;
    $("bgclear").disabled=!bgData;
    if(!bgData){el.style.backgroundImage="";pv.style.backgroundImage="";bgNat={w:0,h:0,k:""};return;}
    if(bgNat.k!==bgKey()){
      var key=bgKey(),im=new Image();
      im.onload=function(){if(key!==bgKey())return;bgNat={w:im.naturalWidth,h:im.naturalHeight,k:key};applyBg();};
      im.src=bgData;
      paintBg(el,1,1);paintBg(pv,1,1);
      return;
    }
    var VW=document.documentElement.clientWidth||window.innerWidth,VH=window.innerHeight,ar=VW/VH;
    pv.style.setProperty("--ar",String(ar));
    paintBg(el,VW,VH);paintBg(pv,170*ar,170);
  }
  function bgChanged(){applyBg();save();}
  $("s-bgz").oninput=function(){st.bgz=+$("s-bgz").value;bgChanged();};
  $("s-bgx").oninput=function(){st.bgx=+$("s-bgx").value;bgChanged();};
  $("s-bgy").oninput=function(){st.bgy=+$("s-bgy").value;bgChanged();};
  $("s-bgfit").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;st.bgfit=b.dataset.v;bgChanged();
  });
  $("bgreset").onclick=function(){st.bgfit="contain";st.bgz=100;st.bgx=50;st.bgy=50;bgChanged();};
  var bgRsz;window.addEventListener("resize",function(){clearTimeout(bgRsz);bgRsz=setTimeout(applyBg,120);});
  $("bgpick").onclick=function(){$("bgfile").click()};
  $("bgclear").onclick=function(){
    bgData="";try{localStorage.removeItem(BGKEY);}catch(e){}
    $("bgnote").textContent="";applyBg();
  };
  $("s-bgv").oninput=function(){st.bgv=+$("s-bgv").value;applyBg();save();};
  $("bgfile").addEventListener("change",function(){
    var inp=this,f=inp.files&&inp.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement("canvas");
        cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        bgData=cv.toDataURL("image/jpeg",0.82);
        $("bgnote").textContent="";
        try{localStorage.setItem(BGKEY,bgData);}catch(e){$("bgnote").textContent="保存できなかったので、このページを閉じるまでの表示になります。";}
        applyBg();
      };
      img.onerror=function(){$("bgnote").textContent="この画像は読み込めませんでした。";};
      img.src=fr.result;
    };
    fr.readAsDataURL(f);inp.value="";
  });

  /* ページ送り: 行の位置を測って、行が途中で切れないページの区切りを作る */
  var pages=[0],pageEnds=[0],lastLines=[],pageIdx=0,lockUntil=0,PAD_START=28,PAD_END=10,saveT,snapT,rszT;
  function vert(){return st.dir==="v"}
  function viewSize(){return vert()?reader.clientWidth:reader.clientHeight}
  function offset(){return Math.abs(vert()?reader.scrollLeft:reader.scrollTop)}
  function scrollToOffset(o,smooth){
    var opt=vert()?{left:-o}:{top:o};
    opt.behavior=smooth?"smooth":"auto";
    reader.scrollTo(opt);
  }
  function nearest(o){
    var best=0,bd=Infinity;
    for(var i=0;i<pages.length;i++){var d=Math.abs(pages[i]-o);if(d<bd){bd=d;best=i;}}
    return best;
  }
  function textWalker(root){
    return document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      var pn=n.parentNode&&n.parentNode.nodeName;
      if(pn==="RT"||pn==="RP"||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
  }
  /* 行の始まりの位置(読み始め側からの距離) */
  function rectS(r){
    var c=reader.getBoundingClientRect(),o=offset();
    return vert()?(c.right-r.right)+o:r.top-c.top+o;
  }
  function measureLines(){
    var c=reader.getBoundingClientRect(),o=offset(),v=vert(),rects=[],lines=[],order=0;
    var tw=textWalker(content),rg=document.createRange(),n;
    while((n=tw.nextNode())){
      rg.selectNodeContents(n);
      var rs=rg.getClientRects();
      for(var i=0;i<rs.length;i++){
        var r=rs[i];if(r.width<0.5||r.height<0.5)continue;
        var se=v?[(c.right-r.right)+o,(c.right-r.left)+o]:[r.top-c.top+o,r.bottom-c.top+o];
        rects.push({s:se[0],e:se[1],n:n,k:order++});
      }
    }
    rects.sort(function(a,b){return a.s-b.s});
    for(var j=0;j<rects.length;j++){
      var L=lines[lines.length-1],t=rects[j];
      if(L&&Math.abs(t.s-L.s)<2){
        L.e=Math.max(L.e,t.e);
        if(t.k<L.k){L.k=t.k;L.n=t.n;}
      }else lines.push({s:t.s,e:t.e,n:t.n,k:t.k});
    }
    return lines;
  }
  /* いま見えているページの先頭の文字を「何段落目の何文字目」で表す */
  function anchorOf(i){
    if(!lastLines.length)return null;
    var base=pages[i]||0,j=0;
    for(;j<lastLines.length;j++){if(lastLines[j].s>=base+1)break;}
    if(j>=lastLines.length)j=lastLines.length-1;
    var L=lastLines[j],n=L.n;
    if(!n||!n.parentNode||!content.contains(n))return null;
    var el=n.parentNode.nodeType===1?n.parentNode:n.parentNode.parentNode,p=el&&el.closest?el.closest("p"):null;
    if(!p)return null;
    var pi=[].indexOf.call(content.querySelectorAll("p"),p);
    if(pi<0)return null;
    var tw=textWalker(p),m,acc=0,found=-1,rg=document.createRange();
    while((m=tw.nextNode())){
      if(m===n){
        for(var c=0;c<m.nodeValue.length;c++){
          rg.setStart(m,c);rg.setEnd(m,c+1);
          var rr=rg.getClientRects()[0];
          if(rr&&rr.width>=0.5&&Math.abs(rectS(rr)-L.s)<2){found=acc+c;break;}
        }
        if(found<0)found=acc;
        break;
      }
      acc+=m.nodeValue.length;
    }
    return found<0?null:{pi:pi,off:found};
  }
  function sOfAnchor(a){
    if(!a)return null;
    var p=content.querySelectorAll("p")[a.pi];if(!p)return null;
    var tw=textWalker(p),m,acc=0;
    while((m=tw.nextNode())){
      var len=m.nodeValue.length;
      if(a.off<acc+len){
        var c=a.off-acc,rg=document.createRange();
        rg.setStart(m,c);rg.setEnd(m,Math.min(len,c+1));
        var rr=rg.getClientRects()[0];
        return rr?rectS(rr):null;
